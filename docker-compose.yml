services:
  postgres:
    image: postgres:16-alpine
    container_name: cementbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cementbook
      POSTGRES_USER: cementbook
      POSTGRES_PASSWORD: cement123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
