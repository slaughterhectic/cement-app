services:
  - type: web
    name: cementbook-api
    runtime: node
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build
    startCommand: npx tsx server/index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
