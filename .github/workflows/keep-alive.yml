name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          curl -f --max-time 30 --retry 2 \
            https://cement-app-ax6u.onrender.com/api/health \
            && echo "Server is alive" || echo "Ping failed (server may be waking up)"
