name: Weekly DB Backup to Google Drive

on:
  schedule:
    - cron: '0 2 * * 0'   # Every Sunday at 2:00 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backup dependencies
        run: npm install --no-save pg xlsx googleapis

      - name: Run backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node scripts/backup-gdrive.js

      - name: Report success
        if: success()
        run: echo "Backup completed on $(date -u '+%Y-%m-%d %H:%M UTC')"
